databases:
  - name: ai-guideline-compass-db
    plan: free
    databaseName: ai_guideline_compass
    user: ai_guideline_compass

services:
  - type: web
    name: ai-guideline-compass-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    preDeployCommand: "PYTHONPATH=. alembic upgrade head"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-guideline-compass-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INVITE_CODE
        generateValue: true
      - key: CHROMA_PERSIST_DIR
        value: /app/vector_store_data
      - key: EMBEDDING_PROVIDER
        value: tfidf
      # 프론트엔드를 Vercel에 배포한 뒤, 실제 Vercel 도메인으로 이 값을 수정하세요.
      - key: CORS_ORIGINS
        value: '["https://YOUR-APP-NAME.vercel.app"]'
      - key: ANTHROPIC_API_KEY
        sync: false
